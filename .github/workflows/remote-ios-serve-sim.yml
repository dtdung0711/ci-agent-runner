name: Remote iOS Simulator with serve-sim

on:
  workflow_dispatch:

jobs:
  run-simulator:
    runs-on: macos-14
    steps:
      - name: 1. Kích hoạt Xcode 16
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          echo "Tìm thấy Xcode 16 tại: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> $GITHUB_ENV
          xcodebuild -version
          swift --version

      - name: 2. Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 3. Clone serve-sim, Patch và Build Native
        run: |
          git clone https://github.com/EvanBacon/serve-sim.git /tmp/serve-sim-src
          cd /tmp/serve-sim-src

          # 3.1 Sửa cờ swiftbuild -> native cho build script
          sed -i '' 's/--build-system swiftbuild/--build-system native/g' packages/serve-sim/Sources/SimNative/build.sh

          # 3.2 Sửa lỗi bất đồng bộ Swift Concurrency trong FrameCapture.swift
          node -e '
            const fs = require("fs");
            const file = "packages/serve-sim/Sources/SimNative/FrameCapture.swift";
            let content = fs.readFileSync(file, "utf8");
            
            content = content.replaceAll(
              "assumeIsolated { $0.captureFrame() }",
              "queue.async { self.assumeIsolated { $0.captureFrame() } }"
            );
            
            fs.writeFileSync(file, content);
            console.log("--> [SUCCESS] Đã patch thành công FrameCapture.swift!");
          '

          # 3.3 Cài đặt và build bản native
          bun install
          bun run packages/serve-sim/build.ts

      - name: 4. Khởi động iPhone Simulator & Đợi Boot
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 15 (" | head -n 1 | awk -F '[()]' '{print $2}')
          echo "Booting device ID: $UDID"
          
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          
          open -a Simulator
          sleep 3

      - name: 5. Chạy serve-sim & Mở Cloudflare Tunnel
        run: |
          # Chạy bản serve-sim nội bộ đã build không bị crash
          node /tmp/serve-sim-src/packages/serve-sim/dist/serve-sim.js --port 3200 --codec mjpeg --fit > /tmp/serve_sim.log 2>&1 &

          # In log ra console
          tail -f /tmp/serve_sim.log &

          sleep 6

          # Tải và chạy Cloudflare Tunnel
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz | tar -xz
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:3200 --no-autoupdate > cf.log 2>&1 &

          # Lấy URL Cloudflare
          sleep 8
          CF_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare\.com' cf.log | head -n 1)

          echo ""
          echo "========================================================================"
          echo "🎉 MÁY ẢO IPHONE SERVE-SIM ĐÃ SẴN SÀNG!"
          echo "👉 TRUY CẬP TRỰC TIẾP:"
          echo "$CF_URL"
          echo "========================================================================"
          echo ""

          # Giữ phiên làm việc 2 tiếng
          sleep 7200
