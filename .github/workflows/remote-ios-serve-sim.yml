name: Remote iOS Simulator with serve-sim

on:
  workflow_dispatch:

jobs:
  run-simulator:
    runs-on: macos-14
    steps:
      - name: 1. Kích hoạt Xcode 16
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          echo "Tìm thấy Xcode 16 tại: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> $GITHUB_ENV
          xcodebuild -version
          swift --version

      - name: 2. Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 3. Clone serve-sim, Tự động Patch toàn diện & Build
        run: |
          git clone https://github.com/EvanBacon/serve-sim.git /tmp/serve-sim-src
          cd /tmp/serve-sim-src

          # Script tự động xử lý toàn bộ lỗi build và cú pháp Swift
          node -e '
            const fs = require("fs");
            const path = require("path");

            // 1. Sửa cờ swiftbuild -> native trong build.sh
            const buildSh = "packages/serve-sim/Sources/SimNative/build.sh";
            if (fs.existsSync(buildSh)) {
              let sh = fs.readFileSync(buildSh, "utf8");
              sh = sh.replaceAll("--build-system swiftbuild", "--build-system native");
              fs.writeFileSync(buildSh, sh);
              console.log("--> [1] Đã sửa build.sh thành --build-system native");
            }

            // 2. Sửa lỗi Actor Concurrency trong FrameCapture.swift
            const frameCap = "packages/serve-sim/Sources/SimNative/FrameCapture.swift";
            if (fs.existsSync(frameCap)) {
              let fc = fs.readFileSync(frameCap, "utf8");
              fc = fc.replaceAll(
                "assumeIsolated { $0.captureFrame() }",
                "queue.async { self.assumeIsolated { $0.captureFrame() } }"
              );
              fs.writeFileSync(frameCap, fc);
              console.log("--> [2] Đã patch luồng queue.async cho FrameCapture.swift");
            }

            // 3. Tự động xóa dấu phẩy thừa trước dấu đóng ngoặc trong tất cả file Swift (CaptureEngine.swift,...)
            const dir = "packages/serve-sim/Sources/SimNative";
            fs.readdirSync(dir).forEach(f => {
              if (f.endsWith(".swift")) {
                const p = path.join(dir, f);
                let code = fs.readFileSync(p, "utf8");
                const patched = code.replace(/,\s*(\n\s*\))/g, "$1");
                if (code !== patched) {
                  fs.writeFileSync(p, patched);
                  console.log("--> [3] Đã xóa dấu phẩy thừa trong file: " + f);
                }
              }
            });
          '

          # Build bản native sạch lỗi
          bun install
          bun run packages/serve-sim/build.ts

      - name: 4. Khởi động iPhone Simulator & Đợi Boot
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 15 (" | head -n 1 | awk -F '[()]' '{print $2}')
          echo "Booting device ID: $UDID"
          
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          
          open -a Simulator
          sleep 3

      - name: 5. Chạy serve-sim & Mở Cloudflare Tunnel
        run: |
          # Chạy bản serve-sim vừa build xong
          node /tmp/serve-sim-src/packages/serve-sim/dist/serve-sim.js --port 3200 --codec mjpeg --fit > /tmp/serve_sim.log 2>&1 &

          # In log ra console
          tail -f /tmp/serve_sim.log &

          sleep 6

          # Tải và chạy Cloudflare Tunnel
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz | tar -xz
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:3200 --no-autoupdate > cf.log 2>&1 &

          # Lấy URL Cloudflare
          sleep 8
          CF_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare\.com' cf.log | head -n 1)

          echo ""
          echo "========================================================================"
          echo "🎉 MÁY ẢO IPHONE SERVE-SIM ĐÃ SẴN SÀNG!"
          echo "👉 TRUY CẬP TRỰC TIẾP:"
          echo "$CF_URL"
          echo "========================================================================"
          echo ""

          # Giữ phiên làm việc 2 tiếng
          sleep 7200
