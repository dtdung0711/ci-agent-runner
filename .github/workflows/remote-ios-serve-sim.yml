name: Remote iOS Simulator with serve-sim

on:
  workflow_dispatch:

jobs:
  run-simulator:
    runs-on: macos-14
    steps:
      - name: 1. Kiểm tra & Khôi phục Cache Bản Build serve-sim
        id: cache-serve-sim
        uses: actions/cache@v4
        with:
          path: /tmp/serve-sim-src
          key: serve-sim-macos14-v5

      - name: 2. Kích hoạt Xcode 16 (Chỉ chạy khi chưa có Cache)
        if: steps.cache-serve-sim.outputs.cache-hit != 'true'
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          echo "Tìm thấy Xcode 16 tại: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> $GITHUB_ENV

      - name: 3. Setup Bun (Chỉ chạy khi chưa có Cache)
        if: steps.cache-serve-sim.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 4. Clone, Patch & Build (Hỗ trợ kéo thả thông minh .ZIP / .IPA)
        if: steps.cache-serve-sim.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/EvanBacon/serve-sim.git /tmp/serve-sim-src
          cd /tmp/serve-sim-src

          # 4.1 Sửa cờ swiftbuild -> native
          sed -i '' 's/--build-system swiftbuild/--build-system native/g' packages/serve-sim/Sources/SimNative/build.sh

          # 4.2 Sửa lỗi Swift Concurrency
          node -e '
            const fs = require("fs");
            const file = "packages/serve-sim/Sources/SimNative/FrameCapture.swift";
            let content = fs.readFileSync(file, "utf8");
            content = content.replaceAll(
              "assumeIsolated { $0.captureFrame() }",
              "Task { await self.captureFrame() }"
            );
            fs.writeFileSync(file, content);
          '

          # 4.3 Xóa dấu phẩy thừa trong file Swift
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dir = "packages/serve-sim/Sources/SimNative";
            fs.readdirSync(dir).forEach(f => {
              if (f.endsWith(".swift")) {
                const p = path.join(dir, f);
                let code = fs.readFileSync(p, "utf8");
                fs.writeFileSync(p, code.replace(/,\s*(\n\s*\))/g, "$1"));
              }
            });
          '

          # 4.4 Patch drop.ts: Tự động trích xuất thư mục .app từ bất kỳ file .zip hoặc .ipa nào
          node -e '
            const fs = require("fs");
            const dropFile = "packages/serve-sim/src/client/utils/drop.ts";
            let content = fs.readFileSync(dropFile, "utf8");

            // 1. Nhận diện .zip và .ipa là app install
            content = content.replace(
              `if (fileExtension(file) === "ipa") return "ipa";`,
              `const ext = fileExtension(file); if (ext === "ipa" || ext === "zip") return "ipa";`
            );

            // 2. Giữ nguyên đuôi mở rộng thật của file
            content = content.replace(
              `const ext = kind === "ipa" ? "ipa" : fileExtension(file);`,
              `const ext = fileExtension(file);`
            );

            // 3. Tự động giải nén và quét tìm file .app bất kể cấu trúc thư mục
            const oldCmd = `const cmd = kind === "ipa"\n      ? \`xcrun simctl install \${udid} \${tmpPath}\`\n      : \`xcrun simctl addmedia \${udid} \${tmpPath}\`;`;
            const newCmd = `let cmd = \`xcrun simctl addmedia \${udid} \${tmpPath}\`;\n    if (kind === "ipa") {\n      cmd = \`bash -c "TMP_DIR=\\\$(mktemp -d); unzip -q -o \\"\${tmpPath}\\" -d \\"\$TMP_DIR\\" 2>/dev/null; APP=\\\$(find \\"\$TMP_DIR\\" -name \\"*.app\\" -type d | head -n 1); if [ -n \\\\\\"\\\$APP\\\\\\" ]; then xcrun simctl install \${udid} \\\\\\"\\\$APP\\\\\\"; rm -rf \\"\$TMP_DIR\\"; else rm -rf \\"\$TMP_DIR\\"; xcrun simctl install \${udid} \\"\${tmpPath}\\"; fi"\`;\n    }`;

            content = content.replace(oldCmd, newCmd);
            fs.writeFileSync(dropFile, content);
            console.log("--> [SUCCESS] Đã cập nhật bộ trích xuất .app thông minh cho drop.ts!");
          '

          # 4.5 Cài đặt và build bản native
          bun install
          bun run packages/serve-sim/build.ts

      - name: 5. Khởi động iPhone Simulator & Đợi Boot hoàn tất
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 15 (" | head -n 1 | awk -F '[()]' '{print $2}')
          echo "Booting device ID: $UDID"
          
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          
          open -a Simulator
          sleep 3

      - name: 6. Chạy serve-sim & Mở Cloudflare Tunnel
        run: |
          # 6.1 Khởi động serve-sim từ bản build đã cache
          node /tmp/serve-sim-src/packages/serve-sim/dist/serve-sim.js --port 3200 --codec mjpeg --fit > /tmp/serve_sim.log 2>&1 &

          # In log
          tail -f /tmp/serve_sim.log &
          sleep 5

          # 6.2 Tải và chạy Cloudflare Tunnel
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz | tar -xz
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:3200 --no-autoupdate > cf.log 2>&1 &

          # 6.3 Đợi Cloudflare cấp URL
          echo "Đang đợi Cloudflare cấp URL..."
          CF_URL=""
          for i in {1..30}; do
            if [ -f cf.log ]; then
              CF_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' cf.log | head -n 1)
              if [ -n "$CF_URL" ]; then
                break
              fi
            fi
            sleep 2
          done

          echo ""
          echo "========================================================================"
          echo "🎉 MÁY ẢO IPHONE SERVE-SIM ĐÃ SẴN SÀNG!"
          echo "👉 TRUY CẬP TRỰC TIẾP:"
          echo "$CF_URL"
          echo "========================================================================"
          echo ""

          # Ghi link vào trang Summary của GitHub Actions
          echo "## 🎉 Máy ảo iOS Simulator đã sẵn sàng!" >> $GITHUB_STEP_SUMMARY
          echo "### 👉 [Bấm vào đây để mở Simulator trên trình duyệt]($CF_URL)" >> $GITHUB_STEP_SUMMARY

          # 6.4 Giữ phiên làm việc 2 tiếng
          sleep 7200
