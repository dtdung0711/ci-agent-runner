name: Tapflow Mac Agent on GitHub Actions

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Thời gian giữ runner (phút)'
        required: false
        default: '120'

jobs:
  run-mac-agent:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup Node.js 22 & Xcode
      - name: Setup Môi trường
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Kích hoạt Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app

      # 2. Khởi động Simulator iPhone
      - name: Khởi động iPhone Simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | awk -F '[()]' '{print $2}')
          DEVICE_NAME=$(xcrun simctl list devices available | grep "$UDID" | head -n 1 | awk -F ' \\(' '{print $1}' | xargs)
          echo "Đang khởi động: $DEVICE_NAME ($UDID)"
          xcrun simctl boot "$UDID" || true
          echo "SELECTED_DEVICE=$DEVICE_NAME" >> $GITHUB_ENV

      # 3. Tạo Patch: Fix CPU 100%, Fix RAM 82% & Tự động tải build từ VPS về
      - name: Tạo CPU, RAM & Remote Build Patch
        run: |
          cat << 'EOF' > /tmp/patch.cjs
          const os = require('os');
          const fs = require('fs');
          const path = require('path');
          const cp = require('child_process');

          // A. Fix CPU 100%
          const origCpus = os.cpus;
          os.cpus = function() {
            const cpus = origCpus.call(os);
            return cpus.map((cpu) => ({
              ...cpu,
              times: { user: 150, nice: 0, sys: 50, idle: 800, irq: 0 }
            }));
          };

          // B. Fix RAM > 80% (Chống bị khóa nút bấm do Overloaded)
          os.freemem = function() {
            return Math.round(os.totalmem() * 0.75); // Báo trống 75% RAM
          };

          // C. Hook spawnSync cho vm_stat và Tự động tải build từ VPS về
          const origSpawnSync = cp.spawnSync;
          cp.spawnSync = function(cmd, args, opts) {
            // Mock vm_stat để RAM luôn hiển thị ~25% (Healthy Xanh lá)
            if (cmd === 'vm_stat') {
              return {
                status: 0,
                stdout: "Mach Virtual Memory Statistics: (page size of 16384 bytes)\nPages free: 600000.\nPages active: 150000.\nPages inactive: 100000.\nPages speculative: 10000.\nPages throttled: 0.\nPages wired down: 50000.\nPages purgeable: 10000.\nPages occupied by compressor: 0.\n"
              };
            }

            // Tự động tải file build từ VPS về runner khi chưa có sẵn
            if ((cmd === 'unzip' || cmd === 'tar') && Array.isArray(args)) {
              for (let i = 0; i < args.length; i++) {
                const arg = args[i];
                if (typeof arg === 'string' && (arg.endsWith('.zip') || arg.endsWith('.tar.gz') || arg.endsWith('.tgz'))) {
                  if (!fs.existsSync(arg)) {
                    const fileName = path.basename(arg);
                    let relayUrl = (process.env.TAPFLOW_RELAY_URL || '').trim().replace(/\/$/, '');
                    relayUrl = relayUrl.replace(/^wss:\/\//i, 'https://').replace(/^ws:\/\//i, 'http://');
                    if (!relayUrl.startsWith('http://') && !relayUrl.startsWith('https://')) {
                      relayUrl = 'https://' + relayUrl;
                    }

                    // Ưu tiên dùng API Token để tải file build
                    const token = process.env.TAPFLOW_API_TOKEN || process.env.TAPFLOW_AGENT_TOKEN || '';
                    const httpUrl = `${relayUrl}/uploads/builds/${fileName}`;
                    const localDest = `/tmp/downloaded-${fileName}`;
                    
                    console.log(`[tapflow-patch] Đang tải build từ: ${httpUrl} -> ${localDest}`);
                    try {
                      const authHeader = token ? `-H "Authorization: Bearer ${token}"` : '';
                      const curlCmd = `curl -k -sL -f ${authHeader} "${httpUrl}" -o "${localDest}"`;
                      cp.execSync(curlCmd, { stdio: 'pipe' });
                      
                      if (fs.existsSync(localDest) && fs.statSync(localDest).size > 0) {
                        args[i] = localDest;
                        console.log(`[tapflow-patch] ✓ Đã tải xong file build (${fs.statSync(localDest).size} bytes)!`);
                      }
                    } catch (err) {
                      console.error(`[tapflow-patch] Lỗi khi tải build:`, err.stderr ? err.stderr.toString() : err.message);
                    }
                  }
                  break;
                }
              }
            }
            return origSpawnSync.call(cp, cmd, args, opts);
          };
          EOF

      # 4. Cache Tapflow & Native Helpers
      - name: Cache Tapflow & Native Helpers
        id: tapflow-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm-global
            /tmp/tapflow-bin-cache
          key: tapflow-ios-helpers-macos15-v2

      # 5. Cài đặt Tapflow & Native Helpers
      - name: Cài đặt Tapflow & Native Helpers
        run: |
          mkdir -p ~/.npm-global
          npm config set prefix '~/.npm-global'
          export PATH="$HOME/.npm-global/bin:$PATH"

          if [ "${{ steps.tapflow-cache.outputs.cache-hit }}" != "true" ]; then
            echo "⚡ Cài đặt và biên dịch lần đầu..."
            npm install -g tapflow

            IOS_AGENT_BIN=$(find "$HOME/.npm-global" -type d -path "*/@tapflowio/ios-agent/bin" | head -n 1)
            mkdir -p /tmp/tapflow-swift /tmp/tapflow-bin-cache
            
            curl -sL https://raw.githubusercontent.com/jo-duchan/tapflow/main/packages/ios-agent/src/screencapture-helper.swift -o /tmp/tapflow-swift/screencapture-helper.swift
            curl -sL https://raw.githubusercontent.com/jo-duchan/tapflow/main/packages/ios-agent/src/touch-helper.swift -o /tmp/tapflow-swift/touch-helper.swift
            curl -sL https://raw.githubusercontent.com/jo-duchan/tapflow/main/packages/ios-agent/src/keyboard-helper.swift -o /tmp/tapflow-swift/keyboard-helper.swift
            curl -sL https://raw.githubusercontent.com/jo-duchan/tapflow/main/packages/ios-agent/src/rotation-helper.swift -o /tmp/tapflow-swift/rotation-helper.swift

            swiftc /tmp/tapflow-swift/screencapture-helper.swift -o "$IOS_AGENT_BIN/screencapture-helper" -framework CoreVideo -framework ImageIO -framework VideoToolbox -framework CoreMedia &
            swiftc /tmp/tapflow-swift/touch-helper.swift -o "$IOS_AGENT_BIN/touch-helper" &
            swiftc /tmp/tapflow-swift/keyboard-helper.swift -o "$IOS_AGENT_BIN/keyboard-helper" &
            swiftc /tmp/tapflow-swift/rotation-helper.swift -o "$IOS_AGENT_BIN/rotation-helper" &
            wait

            chmod +x "$IOS_AGENT_BIN"/*
            cp -r "$IOS_AGENT_BIN"/* /tmp/tapflow-bin-cache/
            echo "✓ Đã lưu cache thành công!"
          else
            echo "🚀 Khôi phục binary từ Cache trong 2 giây..."
            IOS_AGENT_BIN=$(find "$HOME/.npm-global" -type d -path "*/@tapflowio/ios-agent/bin" | head -n 1)
            cp -r /tmp/tapflow-bin-cache/* "$IOS_AGENT_BIN/"
            chmod +x "$IOS_AGENT_BIN"/*
            echo "✓ Khôi phục xong!"
          fi

      # 6. Khởi chạy Tapflow iOS Agent
      - name: Chạy Tapflow iOS Agent
        env:
          TAPFLOW_RELAY_URL: ${{ secrets.TAPFLOW_RELAY_URL }}
          TAPFLOW_AGENT_TOKEN: ${{ secrets.TAPFLOW_AGENT_TOKEN }}
          TAPFLOW_API_TOKEN: ${{ secrets.TAPFLOW_API_TOKEN }}
          NODE_OPTIONS: "--require /tmp/patch.cjs"
          PATH: "/Users/runner/.npm-global/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          TAPFLOW_MAX_SIZE: "960"
          TAPFLOW_IOS_H264_BITRATE: "2500000"
          TAPFLOW_WS_BACKPRESSURE_BYTES: "2097152"
          TAPFLOW_STREAM_METRICS: "1"

        run: |
          echo "Đang kết nối iOS Agent ($SELECTED_DEVICE) tới $TAPFLOW_RELAY_URL ..."
          tapflow agent start --relay "$TAPFLOW_RELAY_URL" --token "$TAPFLOW_AGENT_TOKEN" --platform ios --device "$SELECTED_DEVICE" &

          MINUTES=${{ github.event.inputs.duration_minutes || 120 }}
          echo "Phiên làm việc sẵn sàng trong $MINUTES phút..."
          sleep $((MINUTES * 60))
