name: Tapflow Mac Agent on GitHub Actions

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Thời gian duy trì Agent (phút)'
        required: false
        default: '120'

jobs:
  run-mac-agent:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Cài đặt Node.js 22
      - name: Cài đặt Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 2. Khởi động Simulator iPhone 15
      - name: Khởi động iPhone Simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 15 (" | head -n 1 | awk -F '[()]' '{print $2}')
          echo "Booting device ID: $UDID"
          xcrun simctl boot "$UDID" || true
          open -a Simulator

      # 3. Cài đặt Tapflow và kết nối Agent về VPS
      - name: Kết nối Tapflow Agent tới VPS Relay
        env:
          TAPFLOW_RELAY_URL: ${{ secrets.TAPFLOW_RELAY_URL }}
          TAPFLOW_AGENT_TOKEN: ${{ secrets.TAPFLOW_AGENT_TOKEN }}
        run: |
          npm install -g tapflow

          echo "Đang kết nối Agent tới $TAPFLOW_RELAY_URL ..."
          # Chạy agent kết nối về Relay server
          tapflow agent start --relay "$TAPFLOW_RELAY_URL" --token "$TAPFLOW_AGENT_TOKEN" &

          MINUTES=${{ github.event.inputs.duration_minutes || 120 }}
          echo ""
          echo "========================================================================"
          echo "🚀 Agent đã kết nối thành công về Relay VPS: $TAPFLOW_RELAY_URL"
          echo "👉 Hãy truy cập Web Dashboard trên VPS của bạn để điều khiển thiết bị."
          echo "⏱️ Phiên làm việc sẽ giữ trong $MINUTES phút..."
          echo "========================================================================"
          echo ""

          sleep $((MINUTES * 60))
