name: Tapflow Mac Agent on GitHub Actions

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Thời gian giữ runner (phút)'
        required: false
        default: '120'

jobs:
  run-mac-agent:
    runs-on: macos-15 # <-- Sử dụng macOS 15 Sequoia có đầy đủ Swift Runtime mới nhất
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Cài đặt Node.js 22
      - name: Cài đặt Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 2. Khởi động trước iPhone 15
      - name: Khởi động trước iPhone 15
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 15 (" | head -n 1 | awk -F '[()]' '{print $2}')
          echo "Booting device ID: $UDID"
          xcrun simctl boot "$UDID" || true

      # 3. Tạo patch CPU
      - name: Tạo CPU Patch
        run: |
          cat << 'EOF' > /tmp/patch.cjs
          const os = require('os');
          const origCpus = os.cpus;
          os.cpus = function() {
            const cpus = origCpus.call(os);
            return cpus.map((cpu) => ({
              ...cpu,
              times: { user: 150, nice: 0, sys: 50, idle: 800, irq: 0 }
            }));
          };
          EOF

      # 4. Chạy Agent
      - name: Chạy Tapflow Agent
        env:
          TAPFLOW_RELAY_URL: ${{ secrets.TAPFLOW_RELAY_URL }}
          TAPFLOW_AGENT_TOKEN: ${{ secrets.TAPFLOW_AGENT_TOKEN }}
          NODE_OPTIONS: "--require /tmp/patch.cjs"
        run: |
          npm install -g tapflow

          echo "Đang kết nối Agent tới $TAPFLOW_RELAY_URL ..."
          tapflow agent start --relay "$TAPFLOW_RELAY_URL" --token "$TAPFLOW_AGENT_TOKEN" --device "iPhone 15" &

          MINUTES=${{ github.event.inputs.duration_minutes || 120 }}
          echo ""
          echo "========================================================================"
          echo "🚀 Agent macOS 15 đã sẵn sàng!"
          echo "👉 Hãy vào Web Dashboard và chọn iPhone 15 để xem màn hình mượt mà."
          echo "⏱️ Phiên làm việc sẽ giữ trong $MINUTES phút..."
          echo "========================================================================"
          echo ""

          sleep $((MINUTES * 60))
