name: Ephemeral Woodpecker Agent

on:
  repository_dispatch:
    types: [trigger-agent]
  workflow_dispatch: # Cho phép bấm nút kích hoạt thủ công trên GitHub để test

jobs:
  run-agent:
    runs-on: ubuntu-latest # Chạy trên máy x86_64 miễn phí cực nhanh của GitHub

    steps:
      - name: Start Ephemeral Woodpecker Agent
        run: |
          docker run --rm \
            -e WOODPECKER_SERVER="${{ secrets.WOODPECKER_SERVER_HOST }}" \
            -e WOODPECKER_AGENT_SECRET="${{ secrets.WOODPECKER_AGENT_SECRET }}" \
            -e WOODPECKER_ONE_SHOT=true \
            -v /var/run/docker.sock:/var/run/docker.sock \
            woodpeckerci/woodpecker-agent:v3
