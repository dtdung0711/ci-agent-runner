name: Test VNC & Upterm Remote Desktop

on:
  workflow_dispatch:

jobs:
  vnc-test:
    runs-on: macos-latest

    steps:
      # 1. Bật tính năng Screen Sharing VNC cho macOS ARM64
      - name: Enable VNC Remote Desktop
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -restart -agent -privs -all
          sudo sysadminctl -resetPasswordFor runner -newPassword secret123
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -client_settings -setvnclegacy -vnclegacy yes -client_settings -setvncpw -vnc-password secret123

      # 2. Dọn dẹp key cũ để tránh câu hỏi Overwrite (y/n)
      - name: Clean Old SSH Keys
        run: rm -rf ~/.ssh/id_*

      # 3. Mở đường truyền UPTERM Debug Session
      - name: Setup Upterm Debug Session
        uses: lhotari/action-upterm@v1
        with:
          limit-access-to-actor: false
