skip_clone: true

when:
  event: [tag, release]

steps:
  build-and-publish-ios-appetize:
    image: bash
    environment:
      GITEA_TOKEN:
        from_secret: gitea_token
    commands:
      - set -x

      # 1. Kiểm tra biến GITEA_TOKEN
      - |
        if [ -z "$GITEA_TOKEN" ]; then
          echo "=========================================================="
          echo "LOI FATAL: BIEN GITEA_TOKEN DANG BI RONG!"
          echo "Vui long kiem tra Secret 'gitea_token' tren Woodpecker Web UI."
          echo "=========================================================="
          exit 1
        fi

      # 2. Tải mã nguồn bằng Git Init + Fetch (Giải quyết triệt để lỗi Exit Code 128)
      - |
        TAG_OR_BRANCH="$CI_COMMIT_TAG"
        if [ -z "$TAG_OR_BRANCH" ]; then
          TAG_OR_BRANCH="$CI_COMMIT_BRANCH"
        fi
        if [ -z "$TAG_OR_BRANCH" ]; then
          TAG_OR_BRANCH="main"
        fi
        echo "--> Dang fetch ma nguon cho Tag/Branch: $TAG_OR_BRANCH"

        # Khởi tạo Git ngay tại thư mục hiện tại
        git init
        git remote remove origin 2>/dev/null || true
        git remote add origin https://git.bug.io.vn/dtdung.07/HoaBinhUniMobileApp.git

        # Tải duy nhất Tag/Branch cần thiết về
        git -c http.extraheader="Authorization: token ${GITEA_TOKEN}" fetch --depth=1 origin "$TAG_OR_BRANCH"
        git checkout -f FETCH_HEAD

      # 3. Cài đặt JS Dependencies
      - yarn install --frozen-lockfile || npm install

      # 4. Cài đặt CocoaPods Native
      - cd ios && pod install && cd ..

      # 5. Biên dịch RELEASE cho iOS Simulator
      - xcodebuild -workspace ios/HoaBinhUniMobileApp.xcworkspace -scheme HoaBinhUniMobileApp -configuration Release -sdk iphonesimulator -derivedDataPath ios/build

      # 6. Nén thư mục .app Release thành file .zip
      - cd ios/build/Build/Products/Release-iphonesimulator
      - zip -r ../../../../../HoaBinhUniMobileApp-Appetize.zip HoaBinhUniMobileApp.app
      - cd ../../../../..

      # 7. Upload thành phẩm lên Gitea Release
      - |
        ls -lh HoaBinhUniMobileApp-Appetize.zip
        TAG_NAME="$CI_COMMIT_TAG"
        if [ -z "$TAG_NAME" ]; then
          TAG_NAME="$CI_COMMIT_REF"
        fi
        echo "Đang upload file Appetize ZIP cho Tag: $TAG_NAME ..."
        RELEASE_ID=$(curl -s -H "Authorization: token $GITEA_TOKEN" https://git.bug.io.vn/api/v1/repos/dtdung.07/HoaBinhUniMobileApp/releases | python3 -c "import sys, json; data=json.load(sys.stdin); print(next((r['id'] for r in data if r.get('tag_name')=='$TAG_NAME'), ''))")
        if [ -n "$RELEASE_ID" ]; then
          curl -i -X POST "https://git.bug.io.vn/api/v1/repos/dtdung.07/HoaBinhUniMobileApp/releases/$RELEASE_ID/assets" \
            -H "Authorization: token $GITEA_TOKEN" \
            -F "attachment=@HoaBinhUniMobileApp-Appetize.zip"
          echo "SUCCESS: Đã upload file ZIP cho Appetize thành công!"
        else
          echo "WARNING: Không tìm thấy Release ID cho tag $TAG_NAME"
        fi
