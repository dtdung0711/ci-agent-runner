name: Remote iOS Simulator on macOS

on:
  workflow_dispatch:

jobs:
  run-simulator:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 2. Khởi động iPhone Simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 15 (" | head -n 1 | awk -F '[()]' '{print $2}')
          echo "Booting device ID: $UDID"
          xcrun simctl boot "$UDID" || true
          open -a Simulator

      - name: 3. Khởi động Core Server & Mở Cloudflare Tunnel
        run: |
          # 3.1 Cài đặt idb-companion
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew tap facebook/fb
          brew trust facebook/fb || true
          brew install idb-companion

          # 3.2 Clone mã nguồn server vào ~/ios-bridge
          git clone --depth 1 https://github.com/himanshkukreja/ios-bridge.git ~/ios-bridge

          # 3.3 Cài đặt thư viện phụ thuộc
          python -m pip install --upgrade pip
          pip install -r ~/ios-bridge/requirements.txt
          pip install fb-idb

          # 3.4 Dọn dẹp tiến trình cũ và file cache PID
          lsof -ti:8000 | xargs kill -9 2>/dev/null || true
          rm -rf ~/.ios-bridge

          # 3.5 Chạy trực tiếp backend FastAPI (Tránh câu hỏi [y/N] của CLI)
          cd ~/ios-bridge
          PYTHONPATH=. nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/ios_bridge.log 2>&1 &

          # 3.6 Đợi và kiểm tra phản hồi từ endpoint /web
          echo "Đang đợi server khởi động..."
          for i in {1..20}; do
            if curl -s http://127.0.0.1:8000/ > /dev/null; then
              echo "✅ SERVER ĐÃ PHẢN HỒI THÀNH CÔNG!"
              break
            fi
            sleep 1
          done
          cat /tmp/ios_bridge.log

          # 3.7 Mở Cloudflare Tunnel
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz | tar -xz
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:8000 --no-autoupdate > cf.log 2>&1 &

          sleep 8
          CF_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare\.com' cf.log | head -n 1)

          echo ""
          echo "========================================================================"
          echo "🎉 MÁY ẢO IPHONE ĐÃ SẴN SÀNG!"
          echo "👉 TRUY CẬP TRỰC TIẾP QUA LINK NÀY (Đường dẫn /web chuẩn docs):"
          echo "$CF_URL/web"
          echo "========================================================================"
          echo ""

          # 3.8 Giữ tiến trình hoạt động
          sleep 7200
