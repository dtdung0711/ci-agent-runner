name: Remote iOS Simulator on macOS

on:
  workflow_dispatch:

jobs:
  run-simulator:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 2. Khởi động iPhone Simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 15 (" | head -n 1 | awk -F '[()]' '{print $2}')
          echo "Booting device ID: $UDID"
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          open -a Simulator

      - name: 3. Khởi động Core Server & Mở Cloudflare Tunnel
        run: |
          # 3.1 Cài đặt ffmpeg & idb-companion prebuilt chính thức v1.5.0.b1
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install ffmpeg

          echo "🚀 Tải idb-companion v1.5.0.b1 prebuilt..."
          sudo mkdir -p /opt/homebrew/bin /usr/local/bin /tmp/idb-bin
          curl -sL https://github.com/facebook/idb/releases/download/v1.5.0.b1/idb-companion.universal.tar.gz | tar -xz -C /tmp/idb-bin
          
          # Đưa binary vào các thư mục PATH
          sudo cp -rf /tmp/idb-bin/* /opt/homebrew/bin/ 2>/dev/null || true
          sudo cp -rf /tmp/idb-bin/* /usr/local/bin/ 2>/dev/null || true
          sudo chmod +x /opt/homebrew/bin/idb-companion /usr/local/bin/idb-companion 2>/dev/null || true

          # 3.2 Khởi chạy idb-companion cho Simulator
          echo "🔌 Bật idb-companion cho UDID: $UDID"
          /opt/homebrew/bin/idb-companion --udid "$UDID" > /tmp/companion.log 2>&1 &
          sleep 2

          # 3.3 Clone mã nguồn server vào ~/ios-bridge
          git clone --depth 1 https://github.com/dtdung0711/ios-bridge.git ~/ios-bridge

          # 3.4 Cài đặt thư viện phụ thuộc
          python -m pip install --upgrade pip
          pip install -r ~/ios-bridge/requirements.txt
          pip install Pillow opencv-python aiortc av websockets aiohttp jinja2 python-multipart requests fb-idb psutil

          # 3.5 Dọn dẹp tiến trình và file cache cũ
          lsof -ti:8000 | xargs kill -9 2>/dev/null || true
          rm -rf ~/.ios-bridge

          # 3.6 Khởi chạy FastAPI Server
          cd ~/ios-bridge
          PYTHONPATH=. nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/ios_bridge.log 2>&1 &

          # In log ra console GitHub Actions
          tail -f /tmp/ios_bridge.log &

          # 3.7 Đợi và kiểm tra phản hồi từ server
          echo "Đang đợi server sẵn sàng..."
          SERVER_READY=false
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:8000/docs > /dev/null 2>&1 || curl -s -f http://127.0.0.1:8000/ > /dev/null 2>&1; then
              SERVER_READY=true
              echo "✅ SERVER ĐÃ HOẠT ĐỘNG HOÀN TOÀN TRÊN PORT 8000!"
              break
            fi
            sleep 1
          done

          if [ "$SERVER_READY" = false ]; then
            echo "❌ Lỗi: Server không thể khởi động!"
            cat /tmp/ios_bridge.log
            exit 1
          fi

          # 3.8 Mở Cloudflare Tunnel
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz | tar -xz
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:8000 --no-autoupdate > cf.log 2>&1 &

          sleep 8
          CF_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare\.com' cf.log | head -n 1)

          echo ""
          echo "========================================================================"
          echo "🎉 MÁY ẢO IPHONE ĐÃ SẴN SÀNG!"
          echo "👉 TRUY CẬP VÀO LINK:"
          echo "$CF_URL/web"
          echo ""
          echo "⚠️ LƯU Ý KHI VÀO TRANG TEST:"
          echo "Tại mục 'Stream Mode' bên dưới màn hình, bấm chọn 'WebSocket' hoặc 'Screenshot'"
          echo "để nhận luồng hình ảnh qua đường hầm Cloudflare."
          echo "========================================================================"
          echo ""

          # 3.9 Giữ tiến trình hoạt động
          sleep 7200
