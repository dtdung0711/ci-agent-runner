name: Remote iOS Simulator on macOS

on:
  workflow_dispatch:

jobs:
  run-simulator:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. Khởi động iPhone Simulator
        run: |
          # Tìm và bật Simulator iPhone 15
          UDID=$(xcrun simctl list devices available | grep "iPhone 15 (" | head -n 1 | awk -F '[()]' '{print $2}')
          echo "Booting device ID: $UDID"
          xcrun simctl boot "$UDID" || true
          open -a Simulator
          defaults write com.apple.CoreSimulator.SimulatorFrame ShowSingleWindow -bool true

      - name: 2. Kích hoạt macOS Screen Sharing (VNC)
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -yes \
            -setvncpw -vncpw 123456 \
            -restart -agent -privs -all

      - name: 3. Tải Ngrok trực tiếp (Cực nhanh) & Mở Tunnel
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          # Tải trực tiếp binary ngrok ARM64 (Không qua brew)
          curl -sL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-darwin-arm64.zip -o ngrok.zip
          unzip -q -o ngrok.zip
          chmod +x ngrok

          # Cấu hình Token và khởi chạy
          ./ngrok config add-authtoken "$NGROK_AUTH_TOKEN"
          ./ngrok tcp 5900 --log=stdout > ngrok.log &
          
          # Đợi 5 giây để Ngrok tạo đường hầm
          sleep 5
          
          # In địa chỉ VNC ra màn hình console
          curl -s http://127.0.0.1:4040/api/tunnels | python3 -c '
          import sys, json
          try:
              data = json.load(sys.stdin)
              url = data["tunnels"][0]["public_url"].replace("tcp://", "")
              print("\n" + "="*50)
              print("🎉 KẾT NỐI VNC THÀNH CÔNG!")
              print("👉 VNC Address:", url)
              print("👉 Password VNC: 123456")
              print("="*50 + "\n")
          except Exception as e:
              print("Chưa lấy được tunnel, log chi tiết:", e)
          '

      - name: 4. Giữ phiên làm việc (2 tiếng)
        run: |
          echo "Simulator đang chạy. Mở VNC Viewer trên Windows và kết nối!"
          sleep 7200
