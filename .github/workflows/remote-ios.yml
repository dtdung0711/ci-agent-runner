name: Remote iOS Simulator on macOS

on:
  workflow_dispatch:

jobs:
  run-simulator:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Cài đặt Python 3.11 chuẩn mực (Bỏ cache để không quét tìm file repo gốc)
      - name: Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 2. Khởi động iPhone Simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 15 (" | head -n 1 | awk -F '[()]' '{print $2}')
          echo "Booting device ID: $UDID"
          xcrun simctl boot "$UDID" || true
          open -a Simulator

      - name: 3. Cài đặt Meta IDB & Server iOS Bridge
        run: |
          # 3.1 Cài đặt idb-companion
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew tap facebook/fb
          brew trust facebook/fb || true
          brew install idb-companion

          # 3.2 Clone mã nguồn server vào ~/ios-bridge
          git clone --depth 1 https://github.com/himanshkukreja/ios-bridge.git ~/ios-bridge

          # 3.3 Cài đặt thư viện trên môi trường Python 3.11
          python -m pip install --upgrade pip
          pip install -r ~/ios-bridge/requirements.txt
          pip install fb-idb ios-bridge-cli

          # 3.4 Chạy trực tiếp FastAPI Core Server của ios-bridge
          cd ~/ios-bridge
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/ios_bridge.log 2>&1 &

          # 3.5 Vòng lặp kiểm tra sức khỏe server (Health Check)
          echo "Đang chờ server khởi động..."
          for i in {1..20}; do
            if curl -s http://127.0.0.1:8000/ > /dev/null; then
              echo "✅ SERVER ĐÃ HOẠT ĐỘNG THÀNH CÔNG TRÊN PORT 8000!"
              break
            fi
            sleep 1
          done
          cat /tmp/ios_bridge.log

      - name: 4. Mở Cloudflare Tunnel & Lấy Link Web
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz | tar -xz
          chmod +x cloudflared

          ./cloudflared tunnel --url http://localhost:8000 --no-autoupdate > cf.log 2>&1 &
          sleep 8

          CF_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare\.com' cf.log | head -n 1)

          echo ""
          echo "========================================================================"
          echo "🎉 MÁY ẢO IPHONE TRÊN WEB ĐÃ SẴN SÀNG!"
          echo "👉 TRUY CẬP ĐỂ TEST NGAY (Mở bằng Chrome / Edge):"
          echo "$CF_URL"
          echo "========================================================================"
          echo ""

      - name: 5. Giữ phiên làm việc (2 tiếng)
        run: |
          sleep 7200
