name: Remote iOS Simulator on macOS

on:
  workflow_dispatch:

jobs:
  run-simulator:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. Khởi động iPhone Simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 15 (" | head -n 1 | awk -F '[()]' '{print $2}')
          echo "Booting device ID: $UDID"
          xcrun simctl boot "$UDID" || true
          open -a Simulator

      - name: 2. Cài đặt Meta IDB & Server iOS Bridge
        run: |
          # 2.1 Cài đặt idb-companion (Tắt auto-update để cài nhanh chỉ mất 30s)
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew tap facebook/fb
          brew install idb-companion

          # 2.2 Tạo Virtual Environment và cài đặt đầy đủ gói server
          python3 -m venv /tmp/venv
          source /tmp/venv/bin/activate
          pip install --upgrade pip
          pip install ios-bridge-cli fb-idb

          # 2.3 Khởi động server
          nohup ios-bridge start-server --host 0.0.0.0 --port 8000 > /tmp/ios_bridge.log 2>&1 &
          
          # Đợi server lên sóng và kiểm tra log
          sleep 6
          cat /tmp/ios_bridge.log

      - name: 3. Mở Cloudflare Tunnel & Lấy Link Web
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz | tar -xz
          chmod +x cloudflared

          ./cloudflared tunnel --url http://localhost:8000 --no-autoupdate > cf.log 2>&1 &
          sleep 8

          CF_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare\.com' cf.log | head -n 1)

          echo ""
          echo "========================================================================"
          echo "🎉 MÁY ẢO IPHONE ĐÃ CHẠY HOÀN TẤT!"
          echo "👉 TRUY CẬP TRỰC TIẾP QUA LINK:"
          echo "$CF_URL"
          echo "========================================================================"
          echo ""

      - name: 4. Giữ phiên làm việc (2 tiếng)
        run: |
          sleep 7200
