name: Remote iOS Simulator on macOS

on:
  workflow_dispatch:

jobs:
  run-simulator:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. Khởi động iPhone Simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 15 (" | head -n 1 | awk -F '[()]' '{print $2}')
          echo "Booting device ID: $UDID"
          xcrun simctl boot "$UDID" || true
          open -a Simulator

      - name: 2. Cài đặt và Chạy Server iOS Bridge (Theo đúng docs)
        run: |
          # 1. Tạo Virtual Environment để không bị lỗi PEP 668
          python3 -m venv /tmp/venv
          source /tmp/venv/bin/activate

          # 2. Cài đặt package CLI chính thức của ios-bridge
          pip install --upgrade pip
          pip install ios-bridge-cli

          # 3. Khởi động server cho Team/Web theo đúng docs
          nohup ios-bridge start-server --host 0.0.0.0 --port 8000 > /tmp/ios_bridge.log 2>&1 &
          
          # Đợi server sẵn sàng và in log kiểm tra
          sleep 8
          cat /tmp/ios_bridge.log

      - name: 3. Mở Cloudflare Tunnel & Xuất Link Trình Duyệt
        run: |
          # Tải Cloudflared cho Apple Silicon
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz | tar -xz
          chmod +x cloudflared

          # Mở tunnel trực tiếp vào cổng 8000 của ios-bridge
          ./cloudflared tunnel --url http://localhost:8000 --no-autoupdate > cf.log 2>&1 &
          sleep 8

          CF_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare\.com' cf.log | head -n 1)

          echo ""
          echo "========================================================================"
          echo "🎉 MÁY ẢO IPHONE TRÊN TRÌNH DUYỆT ĐÃ SẴN SÀNG!"
          echo "👉 TRUY CẬP ĐỂ TEST NGAY (Mở bằng Chrome / Edge):"
          echo "$CF_URL"
          echo "========================================================================"
          echo ""

      - name: 4. Giữ phiên làm việc (2 tiếng)
        run: |
          sleep 7200
