name: Remote iOS Simulator with SimStream

on:
  workflow_dispatch:

jobs:
  run-simulator:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Cài đặt Python 3.11
      - name: Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2. Khởi động Simulator iPhone 15
      - name: Khởi động iPhone Simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 15 (" | head -n 1 | awk -F '[()]' '{print $2}')
          echo "Booting device ID: $UDID"
          xcrun simctl boot "$UDID" || true
          open -a Simulator
          defaults write com.apple.CoreSimulator.SimulatorFrame ShowSingleWindow -bool true

      # 3. Cài đặt, Vá lỗi Swift & Chạy SimStream
      - name: Cài đặt và Chạy SimStream
        run: |
          export PYTHONUNBUFFERED=1
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1

          # 3.1 Cài đặt idb-companion & cloudflared qua Homebrew
          brew tap facebook/fb
          brew trust facebook/fb || true
          brew install idb-companion cloudflared || true

          # 3.2 Clone mã nguồn SimStream
          git clone https://github.com/EliotAndres/SimStream.git ~/SimStream
          cd ~/SimStream
          chmod +x *.sh

          # 3.3 VÁ LỖI SWIFT CONCURRENCY TRONG StreamingApp.swift
          python3 -c "
          file_path = 'Sources/StreamingApp.swift'
          with open(file_path, 'r') as f:
              code = f.read()
          old = 'Task { await captureManager.updateConfig(fps: fpsClamped, maxHeight: maxHeightClamped) }'
          new = 'let fFps = fpsClamped; let fHeight = maxHeightClamped; Task { await captureManager.updateConfig(fps: fFps, maxHeight: fHeight) }'
          if old in code:
              code = code.replace(old, new)
              with open(file_path, 'w') as f:
                  f.write(code)
              print('✅ ĐÃ VÁ LỖI SWIFT THÀNH CÔNG!')
          "

          # 3.4 Tạo môi trường ảo .venv theo chuẩn SimStream
          python3 -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install fb-idb websockets grpcio

          # 3.5 Khởi chạy SimStream
          export SIMULATOR_STREAM_PREFER_SOFTWARE_ENCODER=1
          ./start.sh 2>&1 | tee /tmp/simstream.log &

          # 3.6 Giữ phiên làm việc 2 tiếng
          sleep 7200