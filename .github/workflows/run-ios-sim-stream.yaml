name: Remote iOS Simulator with SimStream

on:
  workflow_dispatch:

jobs:
  run-simulator:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Cài đặt Python 3.11
      - name: Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2. Khởi động Simulator iPhone 15
      - name: Khởi động iPhone Simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 15 (" | head -n 1 | awk -F '[()]' '{print $2}')
          echo "Booting device ID: $UDID"
          xcrun simctl boot "$UDID" || true
          open -a Simulator
          
          # Ẩn viền máy để khung hình stream vuông vắn, sắc nét nhất
          defaults write com.apple.CoreSimulator.SimulatorFrame ShowSingleWindow -bool true

      # 3. Cài đặt và Chạy SimStream
      - name: Cài đặt và Chạy SimStream
        run: |
          export PYTHONUNBUFFERED=1
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1

          # 3.1 Cài đặt idb-companion & cloudflared qua Homebrew
          brew tap facebook/fb
          brew trust facebook/fb || true
          brew install idb-companion cloudflared || true

          # 3.2 Clone mã nguồn SimStream
          git clone https://github.com/EliotAndres/SimStream.git ~/SimStream
          cd ~/SimStream
          chmod +x *.sh

          # 3.3 Cài đặt môi trường touch bridge của idb
          pip install --upgrade pip
          pip install fb-idb websockets

          # Tạo venv cho script bridge của SimStream
          python3 -m venv venv
          ./venv/bin/pip install fb-idb websockets grpcio

          # 3.4 Chạy SimStream với chế độ Software Encoder cho máy ảo
          # ./start.sh sẽ tự động mở port 3738 và kết nối Cloudflare Tunnel
          export SIMULATOR_STREAM_PREFER_SOFTWARE_ENCODER=1
          ./start.sh 2>&1 | tee /tmp/simstream.log &

          # 3.5 Theo dõi log và giữ phiên làm việc 2 tiếng
          sleep 7200
