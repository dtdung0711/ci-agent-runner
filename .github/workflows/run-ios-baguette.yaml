name: Remote iOS Simulator with Baguette

on:
  workflow_dispatch:

jobs:
  run-baguette:
    runs-on: macos-15

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 1. Tải và cài đặt Baguette v0.1.92
      - name: Cài đặt Baguette
        run: |
          echo "Đang tải Baguette v0.1.92..."
          mkdir -p /tmp/baguette-pkg
          curl -sL https://github.com/tddworks/baguette/releases/download/v0.1.92/baguette_v0.1.92_macOS_arm64.tar.gz | tar -xz -C /tmp/baguette-pkg
          
          # Tìm chính xác thư mục chứa binary và bundle
          SRC_DIR=$(find /tmp/baguette-pkg -type f -name "Baguette" -exec dirname {} \; | head -n 1)
          echo "Đã tìm thấy file tại: $SRC_DIR"
          
          # Cài đặt nguyên vẹn vào /opt/baguette
          sudo mkdir -p /opt/baguette
          sudo cp -R "$SRC_DIR"/* /opt/baguette/
          
          # Tạo symlink chữ thường và cấp quyền thực thi
          sudo ln -sf /opt/baguette/Baguette /opt/baguette/baguette
          sudo chmod -R 755 /opt/baguette
          
          # Đưa /opt/baguette vào biến PATH hệ thống của GitHub Actions
          echo "/opt/baguette" >> $GITHUB_PATH
          export PATH="/opt/baguette:$PATH"
          
          echo "✅ Kiểm tra Baguette thành công:"
          /opt/baguette/baguette --help

      # 2. Cài đặt Cloudflare Tunnel
      - name: Cài đặt Cloudflare Tunnel
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz | tar -xz
          chmod +x cloudflared
          sudo mv cloudflared /opt/baguette/ || sudo mv cloudflared /usr/local/bin/

      # 3. Khởi động iOS Simulator Headless
      - name: Khởi động iOS Simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m 1 "iPhone" | awk -F '[()]' '{print $2}')
          echo "Booting Device UDID: $UDID"
          xcrun simctl boot "$UDID" || true

      # 4. Khởi chạy Server & Mở Tunnel
      - name: Khởi chạy Baguette Serve & Tunnel
        run: |
          # Chạy server baguette bằng đường dẫn tuyệt đối với port 8421
          nohup /opt/baguette/baguette serve --port 8421 --allowed-hosts '*.trycloudflare.com' > /tmp/baguette.log 2>&1 &

          # Đợi server sẵn sàng
          echo "Đang đợi Baguette server khởi động..."
          for i in {1..25}; do
            if curl -s http://127.0.0.1:8421/simulators > /dev/null; then
              echo "✅ BAGUETTE SERVER ĐÃ SẴN SÀNG!"
              break
            fi
            sleep 1
          done

          # Mở Cloudflare Tunnel trỏ tới cổng 8421
          cloudflared tunnel --url http://localhost:8421 --no-autoupdate > cf.log 2>&1 &

          # Đợi 8 giây lấy link trycloudflare.com
          sleep 8
          CF_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare\.com' cf.log | head -n 1)

          echo ""
          echo "========================================================================"
          echo "🎉 MÁY ẢO IPHONE HEADLESS (60 FPS - BAGUETTE) ĐÃ SẴN SÀNG!"
          echo "👉 TRANG STREAM & ĐIỀU KHIỂN : $CF_URL/simulators"
          echo "👉 TRANG DEVICE FARM (MULTI) : $CF_URL/farm"
          echo "========================================================================"
          echo ""

      # 5. Giữ phiên làm việc và hiển thị log trực tiếp
      - name: Giữ phiên làm việc
        run: |
          echo "Runner đang mở. Xem log trực tiếp:"
          tail -f /tmp/baguette.log &
          sleep 7200
