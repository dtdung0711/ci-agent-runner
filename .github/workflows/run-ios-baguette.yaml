name: Remote iOS Simulator with Baguette

on:
  workflow_dispatch:

jobs:
  run-baguette:
    runs-on: macos-15

    steps:
      - name: Checkout Repo hiện tại
        uses: actions/checkout@v4

      # 1. Chọn Xcode 16 mới nhất có sẵn trên macOS 15
      - name: Chọn Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true
          xcodebuild -version

      # 2. Clone và Build Baguette trực tiếp từ Source
      - name: Clone & Build Baguette
        run: |
          echo "Cloning tddworks/baguette..."
          git clone https://github.com/tddworks/baguette.git /tmp/baguette-src
          cd /tmp/baguette-src

          echo "Building Baguette (Swift Release)..."
          # Chạy script build của dự án
          if [ -f "./build.sh" ]; then
            chmod +x ./build.sh
            ./build.sh
          else
            make
          fi

          # Copy binary vào PATH hệ thống
          sudo cp .build/release/baguette /usr/local/bin/baguette || sudo cp .build/arm64-apple-macosx/release/baguette /usr/local/bin/baguette || sudo cp baguette /usr/local/bin/baguette
          
          # Kiểm tra xem lệnh baguette đã hoạt động chưa
          baguette --help

      # 3. Tải Cloudflare Tunnel
      - name: Tải Cloudflare Tunnel
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz | tar -xz
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      # 4. Khởi động trước 1 thiết bị iOS Simulator
      - name: Khởi động iOS Simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m 1 "iPhone" | awk -F '[()]' '{print $2}')
          echo "Booting device ID: $UDID"
          xcrun simctl boot "$UDID" || true

      # 5. Khởi chạy Baguette Server & Mở Tunnel
      - name: Chạy Baguette Serve & Mở Tunnel
        run: |
          # Chạy server với port 8421
          nohup baguette serve --port 8421 --allowed-hosts '*.trycloudflare.com' > /tmp/baguette.log 2>&1 &

          echo "Đang đợi Baguette server khởi động..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8421/simulators > /dev/null; then
              echo "✅ BAGUETTE SERVER ĐÃ SẴN SÀNG!"
              break
            fi
            sleep 1
          done

          # Mở Cloudflare Tunnel
          cloudflared tunnel --url http://localhost:8421 --no-autoupdate > cf.log 2>&1 &

          # Đợi 8 giây lấy URL
          sleep 8
          CF_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare\.com' cf.log | head -n 1)

          echo ""
          echo "========================================================================"
          echo "🎉 MÁY ẢO IPHONE HEADLESS (60 FPS - BAGUETTE) ĐÃ SẴN SÀNG!"
          echo "👉 TRANG STREAM & ĐIỀU KHIỂN : $CF_URL/simulators"
          echo "👉 TRANG DEVICE FARM         : $CF_URL/farm"
          echo "========================================================================"
          echo ""

      # 6. Giữ phiên làm việc và in log trực tiếp
      - name: Giữ phiên làm việc
        run: |
          echo "Runner đang mở. Xem log chi tiết bên dưới:"
          tail -f /tmp/baguette.log &
          sleep 7200
