name: Remote iOS Simulator with Baguette

on:
  workflow_dispatch:

jobs:
  run-baguette:
    # Bắt buộc dùng runner Apple Silicon (arm64)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Cài đặt Baguette & Cloudflared qua Homebrew
      - name: Cài đặt Baguette & Cloudflared
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1

          # Cài đặt baguette (Apple Silicon native)
          brew tap tddworks/baguette https://github.com/tddworks/baguette.git || true
          brew install baguette || true

          # Nếu brew tap chưa có, fallback build/tải trực tiếp
          if ! command -v baguette &> /dev/null; then
            echo "Cài đặt baguette via brew tap..."
            brew install tddworks/tap/baguette || brew install baguette
          fi

          # Tải cloudflared arm64
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz | tar -xz
          chmod +x cloudflared

      # 2. Khởi động trước 1 thiết bị iOS Simulator
      - name: Khởi động iOS Simulator
        run: |
          # Tìm iPhone 15 hoặc thiết bị bất kỳ có sẵn
          UDID=$(xcrun simctl list devices available | grep -m 1 "iPhone" | awk -F '[()]' '{print $2}')
          echo "Booting device ID: $UDID"
          
          # Dùng lệnh boot của baguette hoặc simctl (không cần chạy 'open -a Simulator')
          baguette boot --udid "$UDID" || xcrun simctl boot "$UDID" || true

      # 3. Khởi chạy Baguette Server & Cloudflare Tunnel
      - name: Chạy Baguette Serve & Mở Tunnel
        run: |
          # QUAN TRỌNG: Cần cờ --allowed-hosts '*.trycloudflare.com' để tránh lỗi 403 Forbidden Origin khi đi qua tunnel
          nohup baguette serve --port 8421 --allowed-hosts '*.trycloudflare.com' > /tmp/baguette.log 2>&1 &

          # Đợi server baguette sẵn sàng
          echo "Đang đợi Baguette server khởi động..."
          for i in {1..20}; do
            if curl -s http://127.0.0.1:8421/simulators > /dev/null; then
              echo "✅ BAGUETTE SERVER ĐÃ SẴN SÀNG TẠI CỔNG 8421!"
              break
            fi
            sleep 1
          done

          # Chạy Cloudflare Tunnel trỏ tới cổng 8421 của Baguette
          ./cloudflared tunnel --url http://localhost:8421 --no-autoupdate > cf.log 2>&1 &

          # Đợi 8 giây để lấy URL trycloudflare.com
          sleep 8
          CF_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare\.com' cf.log | head -n 1)

          echo ""
          echo "========================================================================"
          echo "🎉 MÁY ẢO IPHONE HEADLESS (60 FPS - BAGUETTE) ĐÃ SẴN SÀNG!"
          echo "👉 TRANG QUẢN LÝ / STREAM: $CF_URL/simulators"
          echo "👉 MULTI-DEVICE FARM      : $CF_URL/farm"
          echo "========================================================================"
          echo ""

      # 4. Giữ phiên hoạt động (2 tiếng)
      - name: Giữ phiên làm việc
        run: |
          echo "Runner đang mở. Xem log Baguette realtime:"
          tail -f /tmp/baguette.log &
          sleep 7200
