name: Remote iOS Simulator with Baguette

on:
  workflow_dispatch:

jobs:
  run-baguette:
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Chọn phiên bản Xcode 16 mới nhất trên máy
      - name: Chọn Xcode mới nhất
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      # 2. Clone, Patch Tools Version và Build Baguette
      - name: Clone & Build Baguette
        run: |
          echo "Cloning tddworks/baguette..."
          git clone https://github.com/tddworks/baguette.git /tmp/baguette-src
          cd /tmp/baguette-src

          # Patch tools version từ 6.1 về 6.0 để tương thích với Swift của runner
          sed -i '' 's/swift-tools-version: 6.1/swift-tools-version: 6.0/g' Package.swift || true

          echo "Building Baguette..."
          chmod +x ./build.sh
          ./build.sh

          # Đưa binary baguette vào PATH
          sudo cp .build/release/baguette /usr/local/bin/baguette || sudo cp .build/arm64-apple-macosx/release/baguette /usr/local/bin/baguette
          
          # Kiểm tra
          baguette --help

      # 3. Tải Cloudflare Tunnel
      - name: Tải Cloudflare Tunnel
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz | tar -xz
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      # 4. Khởi động trước 1 thiết bị iOS Simulator
      - name: Khởi động iOS Simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m 1 "iPhone" | awk -F '[()]' '{print $2}')
          echo "Booting device ID: $UDID"
          xcrun simctl boot "$UDID" || true

      # 5. Khởi chạy Baguette Server & Mở Tunnel
      - name: Chạy Baguette Serve & Mở Tunnel
        run: |
          # Chạy server baguette với cờ allowed-hosts
          nohup baguette serve --port 8421 --allowed-hosts '*.trycloudflare.com' > /tmp/baguette.log 2>&1 &

          echo "Đang đợi Baguette server khởi động..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8421/simulators > /dev/null; then
              echo "✅ BAGUETTE SERVER ĐÃ SẴN SÀNG!"
              break
            fi
            sleep 1
          done

          # Mở Cloudflare Tunnel chuyển tiếp cổng 8421
          cloudflared tunnel --url http://localhost:8421 --no-autoupdate > cf.log 2>&1 &

          # Đợi 8 giây lấy link công khai
          sleep 8
          CF_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare\.com' cf.log | head -n 1)

          echo ""
          echo "========================================================================"
          echo "🎉 MÁY ẢO IPHONE HEADLESS (60 FPS - BAGUETTE) ĐÃ SẴN SÀNG!"
          echo "👉 TRANG STREAM & ĐIỀU KHIỂN : $CF_URL/simulators"
          echo "👉 TRANG DEVICE FARM (MULTI) : $CF_URL/farm"
          echo "========================================================================"
          echo ""

      # 6. Giữ phiên làm việc
      - name: Giữ phiên làm việc
        run: |
          echo "Runner đang mở. Xem log chi tiết bên dưới:"
          tail -f /tmp/baguette.log &
          sleep 7200
